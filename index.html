<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alef Beth – Hebräisch lesen lernen</title>
  <meta name="description" content="Lerne das hebräische Alphabet und Hebräisch lesen – Schritt für Schritt vom Alef-Bet über Nikud bis zu echten Wörtern aus dem Siddur.">
  <meta name="theme-color" content="#fcf7ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15110d" media="(prefers-color-scheme: dark)">
  <!-- Vor dem ersten Bild: das gewählte Erscheinungsbild setzen (sonst blitzt
       kurz das falsche Papier auf) und entscheiden, ob der Startbildschirm
       läuft – nur beim ersten Öffnen pro Sitzung (also nicht nach dem
       Neuladen für ein Update) und nie bei reduzierter Bewegung. -->
  <script>
    (function () {
      var root = document.documentElement;
      try {
        var settings = (JSON.parse(localStorage.getItem('alefbeth-state-v1')) || {}).settings || {};
        if (settings.theme) root.setAttribute('data-theme', settings.theme);
        var calm = settings.reduceMotion || matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!calm && !sessionStorage.getItem('alefbeth-splash')) root.classList.add('is-splash');
        sessionStorage.setItem('alefbeth-splash', '1');
      } catch (e) {
        // Ohne Speicher kein Startbildschirm – die App startet trotzdem.
      }
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- Die Oberflächenschrift steht auf jeder Seite – früh laden, damit die
       Ersatzschrift nur kurz oder gar nicht zu sehen ist. -->
  <link rel="preload" href="fonts/rubik-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

      </div>
    </div>
    <p class="ab-splash__word"><span class="text-title">Alef Beth</span><span class="ab-splash__tagline text-caption">Hebräisch lesen lernen</span></p>
  </div>

  <!-- tabindex="-1": nach jedem Screenwechsel wird hierher fokussiert, damit
       Screenreader am Anfang des neuen Bildschirms landen. -->

       Die <i data-icon> ersetzt js/alefbeth.js beim Start durch Inline-SVGs. -->
