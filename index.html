<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alef Beth – Hebräisch lesen lernen</title>
  <meta name="description" content="Lerne das hebräische Alphabet und Hebräisch lesen – Schritt für Schritt vom Alef-Bet über Nikud bis zu echten Wörtern aus dem Siddur.">
  <meta name="theme-color" content="#fcf7ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15110d" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- Die Oberflächenschrift steht auf jeder Seite – früh laden, damit die
       Ersatzschrift nur kurz oder gar nicht zu sehen ist. -->
  <link rel="preload" href="fonts/rubik-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- tabindex="-1": nach jedem Screenwechsel wird hierher fokussiert, damit
       Screenreader am Anfang des neuen Bildschirms landen. -->
  <main id="app" tabindex="-1"></main>

  <nav id="bottomnav" aria-label="Hauptnavigation">
    <a href="#/" data-route="home"><span class="nav-ico" aria-hidden="true">🏠</span><span>Lernen</span></a>
    <a href="#/review" data-route="review"><span class="nav-ico-wrap"><span class="nav-ico" aria-hidden="true">🔁</span><span class="badge" id="nav-badge" hidden></span></span><span>Üben</span></a>
    <a href="#/alphabet" data-route="alphabet"><span class="nav-ico nav-he" aria-hidden="true">א</span><span>Alef-Bet</span></a>
    <a href="#/settings" data-route="settings"><span class="nav-ico" aria-hidden="true">⚙️</span><span>Mehr</span></a>
  </nav>

  <noscript>
    <p style="max-width:540px;margin:2rem auto;padding:0 1rem">
      Für Alef Beth muss JavaScript aktiviert sein.
    </p>
  </noscript>

  <!-- Design-System-Helfer zuerst: legt window.AlefBeth an, das js/ui.js
       an die Module weiterreicht (defer und Module laufen in dieser Reihenfolge). -->
  <script defer src="js/alefbeth.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
