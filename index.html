<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alef Beth – Hebräisch lesen lernen</title>
  <meta name="description" content="Lerne das hebräische Alphabet und Hebräisch lesen – Schritt für Schritt vom Alef-Bet über Nikud bis zu echten Wörtern aus dem Siddur.">
  <meta name="theme-color" content="#fcf7ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15110d" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- Die Oberflächenschrift steht auf jeder Seite – früh laden, damit die
       Ersatzschrift nur kurz oder gar nicht zu sehen ist. -->
  <link rel="preload" href="fonts/rubik-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- tabindex="-1": nach jedem Screenwechsel wird hierher fokussiert, damit
       Screenreader am Anfang des neuen Bildschirms landen. -->
  <main id="app" tabindex="-1"></main>

  <!-- Tab-Leiste: die Pille gleitet zum aktiven Tab (--active setzt app.js).
       Die <i data-icon> ersetzt js/alefbeth.js beim Start durch Inline-SVGs. -->
  <nav class="ab-nav" id="bottomnav" aria-label="Hauptnavigation">
    <ul class="ab-nav__list" style="--count: 4; --active: 0">
      <li class="ab-nav__pill" aria-hidden="true"></li>
      <li><a class="ab-nav__link text-caption" href="#/" data-route="home"><span class="ab-nav__icon"><i data-icon="book"></i></span><span class="ab-nav__label">Lernen</span></a></li>
      <li><a class="ab-nav__link text-caption" href="#/review" data-route="review"><span class="ab-nav__icon"><i data-icon="repeat"></i><span class="ab-count text-label" id="nav-badge" aria-hidden="true" hidden></span></span><span class="ab-nav__label">Üben</span><span class="ab-sr" id="nav-due"></span></a></li>
      <li><a class="ab-nav__link text-caption" href="#/alphabet" data-route="alphabet"><span class="ab-nav__icon"><span class="ab-nav__he" lang="he" aria-hidden="true">א</span></span><span class="ab-nav__label">Alef-Bet</span></a></li>
      <li><a class="ab-nav__link text-caption" href="#/settings" data-route="settings"><span class="ab-nav__icon"><i data-icon="sliders"></i></span><span class="ab-nav__label">Mehr</span></a></li>
    </ul>
  </nav>

  <noscript>
    <p style="max-width:540px;margin:2rem auto;padding:0 1rem">
      Für Alef Beth muss JavaScript aktiviert sein.
    </p>
  </noscript>

  <!-- Design-System-Helfer zuerst: legt window.AlefBeth an, das js/ui.js
       an die Module weiterreicht (defer und Module laufen in dieser Reihenfolge). -->
  <script defer src="js/alefbeth.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
